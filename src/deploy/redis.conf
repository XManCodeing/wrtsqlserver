# Redis 7.4 development only: no password, never expose to untrusted networks.
# Docker binds the published port to an explicitly confirmed LAN IPv4. This is
# NOT source isolation (routing/Docker direct access may bypass that expectation).
# protected-mode no is deliberate for unauthenticated LAN development; explicit
# REDIS_LAN_ACCESS_CONFIRMED=yes is mandatory in redis-init.sh. No firewall edits.
bind 0.0.0.0
port 6379
protected-mode no
daemonize no
logfile ""
dir /data
dbfilename dump.rdb
appendonly no
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
maxmemory 128mb
maxmemory-policy noeviction
# A failed write is intentional and visible rather than silent key eviction.
