name: Publish relay image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 1.0.0 (use a new version for every release)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Serialize publication because all versions share the mutable latest image alias.
  group: relay-release-publication
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate version and image name
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            version="$INPUT_VERSION"
          else
            version="${REF_NAME#v}"
          fi
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { printf 'Invalid release version\n' >&2; exit 1; }
          image="ghcr.io/${REPOSITORY,,}"
          printf 'version=%s\nimage=%s\n' "$version" "$image" >> "$GITHUB_OUTPUT"
      - name: Refuse an already published version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -eu
          # Only a proven 404 permits a new release; auth/network failures stop publication.
          response=$(gh api "repos/$GH_REPO/releases/tags/v$VERSION" --include 2>&1) && { printf 'Version already published; choose a new version\n' >&2; exit 1; }
          [[ "$response" == *'HTTP 404'* || "$response" == *'HTTP/2.0 404'* || "$response" == *'HTTP/2 404'* ]] || { printf 'Cannot confirm release absence\n' >&2; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - name: Test frontend
        working-directory: src/frontend
        run: npm ci && npm test && npm run build
      - name: Test backend
        working-directory: src/backend
        run: go test -race ./... && go vet ./...
      - name: Test deployment isolation
        run: python3 -m unittest discover -s src/deploy/tests -v
      - name: Package manual deployment tools
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -eu
          (cd src/backend && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o ../deploy/deploy-stat ./cmd/deploy-stat)
          (cd src/backend && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o ../deploy/relay-updater ./cmd/relay-updater)
          mkdir -p release
          tar -czf "release/db-relay-deploy-$VERSION.tar.gz" -C src/deploy common.sh ports-common.sh lan-rules.sh legacy-lan-validate.awk lan-manage.sh lan-restore.sh updater-service.sh redis-init.sh relay-init.sh relay-update.sh updater-preflight.sh updater-start.sh redis.conf deploy-stat relay-updater
          (cd release && sha256sum "db-relay-deploy-$VERSION.tar.gz" > SHA256SUMS)
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse an existing image version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.release.outputs.version }}
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ steps.release.outputs.image }}
        run: |
          set -eu
          # The registry verifies existence without relying on mutable local tags.
          # A missing release alone does not mean an earlier interrupted build never pushed an image.
          if docker buildx imagetools inspect "$IMAGE:$VERSION" > /dev/null 2> image-check-error.txt; then
            printf 'Image version already exists; choose a new version\n' >&2
            exit 1
          fi
          if ! grep -Eq 'manifest unknown|not found' image-check-error.txt; then
            printf 'Cannot verify registry version absence\n' >&2
            exit 1
          fi
      - name: Build linux/amd64 image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
          build-args: VERSION=${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          # Older Docker 20.10 hosts: publish a conventional image without attestation manifests.
          provenance: false
          sbom: false
      - name: Smoke-test built image before publication
        env:
          IMAGE: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
        run: python3 src/deploy/tests/image_smoke.py "$IMAGE"
      - name: Push verified image and resolve registry digest
        id: published
        env:
          IMAGE: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
        run: |
          set -eu
          docker push "$IMAGE"
          digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))')
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Record exact image identity
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
          DIGEST: ${{ steps.published.outputs.digest }}
        run: |
          set -eu
          printf '%s:%s\n%s@%s\n' "$IMAGE" "$VERSION" "$IMAGE" "$DIGEST" > release/IMAGE.txt
          jq -n --arg version "$VERSION" --arg image "$IMAGE" --arg digest "$DIGEST" '{version:$version,image:$image,digest:$digest,platform:"linux/amd64"}' > release/relay-release.json
          printf 'Image: `%s:%s`\n\nDigest: `%s`\n\nDownload the matching manual-deploy artifact. No router deployment was performed.\n' "$IMAGE" "$VERSION" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: db-relay-deploy-${{ steps.release.outputs.version }}
          path: release/
          if-no-files-found: error
          retention-days: 30
      - name: Publish update discovery release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.release.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          set -eu
          # Publish only after the image and all attachments are ready. Drafts are never offered by the updater.
          gh release create "v$VERSION" --target "$COMMIT" --title "v$VERSION" --draft --notes 'Relay update: download and verify the pinned linux/amd64 image, replace only db-relay, health-check and retain rollback. Redis remains independent.' release/relay-release.json release/IMAGE.txt release/SHA256SUMS "release/db-relay-deploy-$VERSION.tar.gz"
          gh release edit "v$VERSION" --draft=false --latest
      - name: Publish latest convenience alias
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
          DIGEST: ${{ steps.published.outputs.digest }}
        run: |
          set -eu
          # Alias the exact tested local image only after its discovery release is published.
          # Online updates keep using the immutable digest, never this mutable alias.
          docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
          docker push "$IMAGE:latest"
          latest_digest=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Manifest}}' | jq -er '.digest')
          [ "$latest_digest" = "$DIGEST" ] || { printf 'latest digest mismatch\n' >&2; exit 1; }
          printf 'Convenience alias: `%s:latest` (same verified digest)\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
